<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Dashboard Murid - SMK Al-Madani</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { perhotelan: '#D0EFB5', mplb: '#EB7878', pplg: '#2F3E75' }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-100 min-h-screen">
    <nav class="bg-pplg text-white px-6 py-4 flex justify-between items-center">
        <h1 class="font-bold">Portal Murid - SMK Al-Madani Garut</h1>
        <button onclick="logout()" class="bg-mplb text-white px-4 py-1.5 rounded text-sm font-bold">Logout</button>
    </nav>

    <div class="container mx-auto p-6 space-y-6">
        <!-- Informasi Profil Siswa -->
        <div class="bg-white p-6 rounded-xl shadow border-l-8 border-pplg flex justify-between items-center">
            <div>
                <h2 id="studentName" class="text-2xl font-bold text-pplg">Nama Siswa</h2>
                <p id="studentDetail" class="text-sm text-gray-500">Jurusan: - | Email: -</p>
            </div>
            <span class="bg-perhotelan text-pplg px-4 py-2 rounded-full font-bold text-sm">Status: Aktif</span>
        </div>

        <!-- FITUR 1: ABSENSI -->
        <div class="bg-white p-6 rounded-xl shadow border-l-8 border-perhotelan">
            <h3 class="text-xl font-bold text-pplg mb-2">Presensi / Absensi Harian</h3>
            <p class="text-sm text-gray-600 mb-4">Klik status kehadiran Anda hari ini:</p>
            <div class="flex gap-3">
                <button onclick="submitAbsensi('Hadir')"
                    class="bg-perhotelan text-pplg font-bold px-6 py-2 rounded-lg">Hadir</button>
                <button onclick="submitAbsensi('Izin')"
                    class="bg-yellow-200 text-yellow-800 font-bold px-6 py-2 rounded-lg">Izin</button>
                <button onclick="submitAbsensi('Sakit')"
                    class="bg-mplb text-white font-bold px-6 py-2 rounded-lg">Sakit</button>
            </div>
            <p id="absenMsg" class="mt-3 text-sm font-bold text-green-700"></p>
        </div>

        <!-- FITUR 2: KUIS -->
        <div class="bg-white p-6 rounded-xl shadow border-l-8 border-mplb">
            <h3 class="text-xl font-bold text-pplg mb-4">Kuis Online Tersedia</h3>
            <div id="quizList" class="space-y-4"></div>
        </div>
    </div>

    <script src="db.js"></script>
    <script>
        const currentUser = checkAccess('murid');

        if (currentUser) {
            document.getElementById('studentName').innerText = currentUser.name;
            document.getElementById('studentDetail').innerText = `Jurusan: ${currentUser.jurusan} | Email: ${currentUser.email}`;
            renderKuis();
        }

        function submitAbsensi(status) {
            let listAbsen = JSON.parse(localStorage.getItem('DB_ABSENSI'));
            listAbsen.push({
                nama: currentUser.name,
                email: currentUser.email,
                jurusan: currentUser.jurusan,
                status: status,
                waktu: new Date().toLocaleString()
            });
            localStorage.setItem('DB_ABSENSI', JSON.stringify(listAbsen));
            document.getElementById('absenMsg').innerText = `[Tersimpan] Anda mengisi presensi: ${status}`;
        }

        function renderKuis() {
            const listKuis = JSON.parse(localStorage.getItem('DB_KUIS'));
            const container = document.getElementById('quizList');
            container.innerHTML = '';

            listKuis.forEach((q, idx) => {
                let optionsHtml = '';
                q.opsi.forEach((opt, optIdx) => {
                    optionsHtml += `
                        <label class="block text-sm">
                            <input type="radio" name="quiz_${q.id}" value="${optIdx}"> ${opt}
                        </label>
                    `;
                });

                container.innerHTML += `
                    <div class="p-4 border rounded-lg bg-gray-50">
                        <p class="font-bold text-pplg mb-2">${idx + 1}. ${q.soal}</p>
                        <div class="space-y-1 mb-3">${optionsHtml}</div>
                        <button onclick="checkAnswer(${q.id}, ${q.jawaban})" class="bg-pplg text-white px-4 py-1.5 rounded text-sm font-bold">Kirim Jawaban</button>
                    </div>
                `;
            });
        }

        function checkAnswer(quizId, jawabanBenar) {
            const selected = document.querySelector(`input[name="quiz_${quizId}"]:checked`);
            if (!selected) return alert('Pilih jawaban terlebih dahulu!');

            if (parseInt(selected.value) === jawabanBenar) {
                alert('Selamat! Jawaban Anda BENAR (Nilai: 100)');
            } else {
                alert('Jawaban SALAH. Silakan coba lagi!');
            }
        }
    </script>
</body>

</html>
